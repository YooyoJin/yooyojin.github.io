<script src="https://cdn.jsdelivr.net/npm/plantuml-encoder/dist/plantuml-encoder.min.js"></script>
<script>
function render_plantuml() {
    document.querySelectorAll('.language-plantuml, .plantuml').forEach(function(block) {
        var umlCode = (block.textContent || block.innerText).trim();
        var encoded = plantumlEncoder.encode(umlCode);
        var img = document.createElement('img');
        img.src = 'https://www.plantuml.com/plantuml/svg/' + encoded;
        img.alt = 'PlantUML diagram';
        block.parentNode.replaceChild(img, block);
    });
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render_plantuml);
} else {
    render_plantuml();
}
</script>
