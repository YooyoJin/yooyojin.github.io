<!-- Slightly Modified from _layouts/home.html -->

<!DOCTYPE HTML>
<html lang="en" >
    <head>
        {%- include head.html -%}

        {% if site.posts.last %}
            <link rel="next" href="{{site.baseurl}}{{site.posts.last.url}}" />
        {% endif %}
    </head>
    <body>
        <div class="book">

            {%- include toc-date.html -%}

            <div class="book-body">
                <div class="book-header" role="navigation">
                    <!-- 解决多个h1导致bing收录问题 -->
                    <!-- Title -->
                    <!-- <h1>
                        <i class="fa fa-circle-o-notch fa-spin"></i>
                        {% if page.title %}
                            <a href="." >{{ page.title | escape }}</a>
                        {% else %}
                            <a href="." >{{ site.title | escape }}</a>
                        {% endif %}
                    </h1> -->

                    <h1 aria-hidden="true" style="font-size: 0 !important; margin: 0 !important;">
                        <!-- 空内容或保留按钮 -->
                    </h1>
                </div>

                <div class="body-inner">
                    <div class="page-wrapper" tabindex="-1" role="main">
                        <div class="page-inner">
                            <section class="normal markdown-section">
                                {% if page.title %}
                                    <h1 id="{{ page.id }}">{{ page.title | escape }}</h1>
                                {% else %}
                                    <h1 id="{{ page.id }}">{{ site.title | escape }}</h1>
                                {% endif %}

                                <br />
                            </section>

                            {{ content }}

                            <div id="book-search-results">
                                <div class="search-noresults">

                                </div>

                                {%- include search.html -%}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <script>
            var gitbook = gitbook || [];
            gitbook.push(function() {
                gitbook.page.hasChanged({%- include metadata-home.json.tpl -%});
            });
            </script>
        </div>

        {%- include footer.html -%}

    </body>
</html>
